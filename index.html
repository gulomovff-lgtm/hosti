<meta charset="utf-8">

<title>Hosti — хостелы Узбекистана без комиссии</title>

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  /* ============================================================ ПАЛИТРА БРЕНДА
     Бренд-бук Hosti v2.0 задаёт две среды, и обе здесь дословно.

     Цифровая (тёмная): Void #000000 — фон, Deep #04150E — карточки и панели,
     Mint #1FC08F — основной акцент и действие, Verdant #15846E — линии и второй
     план, Amber #FFB829 — точка бренда и предупреждения, Lilac #8E7BE8 —
     данные, Silver #C4C7C4 — текст, Dim #6E736F — подписи.

     Печатная (светлая): фон-ступень #ECF0EB, Bone #EEF1EA — разворот,
     Juniper #14382C — заголовки, Saffron #C96F27 — акцентная точка,
     Sage #DFE5DC — плашки, Vellum #C3CDBD — разделители,
     Graphite #57605A — текст, Ash #8B948D — вторичный.

     Тема переключается атрибутом data-theme на <html>: light / dark.
     Значение «системная» слушает prefers-color-scheme.                        */

  /* Правило поверхностей: между фоном страницы и карточкой всегда виден шаг.
     Раньше фон был #F5F7F2, а карточка #FFFFFF — разница в 4%, из-за чего
     всё сливалось в одно молочное поле. Теперь фон уходит на ступень ниже,
     карточка остаётся белой, и её край читается даже без тени. */
  :root, html[data-theme="light"]{
    --void:#ECF0EB;                    /* фон страницы: ступень под карточкой */
    --surface:#FFFFFF;                 /* карточка */
    --surface-2:#F3F6F2;               /* вложенная плашка */
    --surface-3:#E1E8DF;               /* выделенная строка, нажатие */
    --ink:#0E1A15;                     /* заголовки: почти чёрный, не сизый */
    --text:#18231E;
    --muted:#5A655E;
    --faint:#8A938C;                   /* Ash */
    --line:#DCE2DA;                    /* волосок внутри карточки */
    --line-strong:#C2CCBF;             /* край карточки, рамка поля */
    --line-soft:#E7EBE5;
    --accent:#0F7A62;                  /* Verdant, углублён до 4.5:1 на белом */
    --accent-press:#0A6250;
    --accent-soft:#E1F0EA;
    --on-accent:#FFFFFF;
    --dot:#C25E1B;                     /* Saffron: акцентная точка бренда */
    --warn:#96500F;
    --data:#4B3E96;                    /* Lilac, притемнённый под контраст */
    --ok:#0F7A62;
    --overlay:rgba(14,26,21,.44);
    --skel-a:#E2E8E0; --skel-b:#F1F4F0;
    --glow:rgba(15,122,98,.20);
    --shadow:0 1px 1px rgba(14,26,21,.04), 0 6px 18px rgba(14,26,21,.06);
    --shadow-lift:0 2px 6px rgba(14,26,21,.07), 0 18px 42px rgba(14,26,21,.12);
    --mesh-1:rgba(15,122,98,.10); --mesh-2:rgba(194,94,27,.08);
  }
  html[data-theme="dark"]{
    --void:#000000;                    /* Void: фон интерфейса */
    --surface:#0C1712;                 /* карточка: приподнята над пустотой */
    --surface-2:#13211A;
    --surface-3:#1B2C23;
    --ink:#FFFFFF;
    --text:#EAF0EC;
    --muted:#A9B3AD;
    --faint:#77817B;
    --line:#22302A;                    /* волосок внутри карточки */
    --line-strong:#32433B;             /* край карточки */
    --line-soft:#182219;
    --accent:#25C795;                  /* Mint: основной акцент */
    --accent-press:#1BAA7E;
    --accent-soft:rgba(37,199,149,.16);
    --on-accent:#04150E;
    --dot:#FFB829;                     /* Amber: точка бренда */
    --warn:#FFB829;
    --data:#9C8BF0;                    /* Lilac */
    --ok:#25C795;
    --overlay:rgba(0,0,0,.70);
    --skel-a:#101C16; --skel-b:#1A281F;
    --glow:rgba(37,199,149,.28);
    --shadow:0 1px 2px rgba(0,0,0,.6), 0 10px 30px rgba(0,0,0,.5);
    --shadow-lift:0 2px 8px rgba(0,0,0,.7), 0 22px 50px rgba(0,0,0,.6);
    --mesh-1:rgba(37,199,149,.16); --mesh-2:rgba(255,184,41,.07);
  }

  :root{--app-h:100dvh;--safe-top:0px;--safe-bottom:0px;--fs-pad-right:0px;
        --e-spring:cubic-bezier(.34,1.4,.5,1);--e-out:cubic-bezier(.2,.7,.3,1);--e-in:cubic-bezier(.4,0,1,1)}

  html,body{margin:0;padding:0;background:var(--void);color:var(--text);
    font-family:'HostiText','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
  /* x: жест «назад по истории» перехватывал горизонтальные свайпы у левого
     края — вкладки, онбординг и фото листались, а браузер уходил со страницы */
  body{overscroll-behavior-y:none;overscroll-behavior-x:none}
  /* Смена темы плавная, но только по цвету — геометрия не «дышит» */
  html.hs-theming, html.hs-theming *{transition:background-color .3s ease, color .3s ease, border-color .3s ease, fill .3s ease}
  input,button,textarea,select{font-family:inherit;font-size:16px}
  button{-webkit-appearance:none}
  ::-webkit-scrollbar{width:0;height:0}
  #root{min-height:var(--app-h);position:relative}

  /* Фирменное свечение фона: пятна мяты и янтаря, как на разворотах бренд-бука.
     Медленное дыхание вместо постоянной анимации — чтобы не жечь батарею. */
  #root::before{
    content:'';position:fixed;inset:-25% -20% auto -20%;height:78vh;pointer-events:none;z-index:0;
    background:
      radial-gradient(46% 40% at 16% 6%, var(--mesh-1), transparent 70%),
      radial-gradient(40% 34% at 90% 0%, var(--mesh-2), transparent 72%);
    animation:hsBreathe 20s ease-in-out infinite alternate;
  }
  @keyframes hsBreathe{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(0,2%,0) scale(1.09)}}

  /* ============================================================ ДВИЖЕНИЕ
     Пружина на появлениях, разгон на уходах, 120 мс на отклик пальцу. */
  /* Только прозрачность и никакого transform: этим классом main.jsx оборачивает
     КАЖДЫЙ экран, а пока внутри анимации живёт transform, элемент становится
     containing block — и любая липкая панель position:fixed внутри экрана
     уезжает в конец документа. Сдвиг при появлении делает .hs-rise на блоках. */
  .hs-fade{animation:hsFade .26s var(--e-out) both}
  @keyframes hsFade{from{opacity:0}to{opacity:1}}
  .hs-rise{animation:hsRise .3s var(--e-spring) both}
  @keyframes hsRise{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}
  .hs-pop{animation:hsPop .34s var(--e-spring) both}
  @keyframes hsPop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
  .hs-sheet{animation:hsSheet .34s var(--e-spring) both}
  @keyframes hsSheet{from{transform:translate3d(0,100%,0)}to{transform:none}}
  .hs-sheet-out{animation:hsSheetOut .2s var(--e-in) both}
  @keyframes hsSheetOut{from{transform:none}to{transform:translate3d(0,100%,0)}}
  .hs-stamp{animation:hsStamp .44s var(--e-spring) both}
  @keyframes hsStamp{0%{opacity:0;transform:scale(.6) rotate(-8deg)}60%{opacity:1}100%{opacity:1;transform:scale(1) rotate(0)}}

  /* Лента появляется каскадом: карточки выезжают одна за другой */
  .hs-stagger>*{animation:hsRise .34s var(--e-spring) both}
  .hs-stagger>*:nth-child(1){animation-delay:.02s} .hs-stagger>*:nth-child(2){animation-delay:.06s}
  .hs-stagger>*:nth-child(3){animation-delay:.10s} .hs-stagger>*:nth-child(4){animation-delay:.14s}
  .hs-stagger>*:nth-child(5){animation-delay:.18s} .hs-stagger>*:nth-child(6){animation-delay:.22s}
  .hs-stagger>*:nth-child(7){animation-delay:.26s} .hs-stagger>*:nth-child(n+8){animation-delay:.3s}

  .hs-skel{background:linear-gradient(90deg,var(--skel-a) 25%,var(--skel-b) 37%,var(--skel-a) 63%);background-size:400% 100%;animation:hsSk 1.3s infinite}
  @keyframes hsSk{from{background-position:100% 50%}to{background-position:0 50%}}
  .hs-scroll{overflow-x:auto;scrollbar-width:none}

  /* Пульс мятного свечения у главного действия — живая кнопка, но не мигалка */
  .hs-glow{animation:hsGlow 2.8s var(--e-out) infinite}
  @keyframes hsGlow{0%{box-shadow:0 0 0 0 var(--glow)}70%{box-shadow:0 0 0 16px transparent}100%{box-shadow:0 0 0 0 transparent}}

  input:focus,textarea:focus,select:focus{border-color:var(--accent)!important;outline:2px solid var(--accent);outline-offset:1px}
  button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:16px}
  input::placeholder,textarea::placeholder{color:var(--faint)}

  .hs-tap{transition:background-color .12s linear, transform .12s var(--e-out)}
  .hs-tap:active{background:var(--surface-3)!important;transform:scale(.995)}
  .hs-tab:active{background:var(--surface-2)}
  button:disabled{cursor:default}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
<script>
  /* Тема выбирается до первой отрисовки: иначе на старте мигает светлым. */
  (function () {
    try {
      var p = JSON.parse(localStorage.getItem('hosti_prefs_v4') || '{}');
      var mode = p.theme || 'system';
      var dark = mode === 'dark' || (mode === 'system'
        && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      var m = document.querySelector('meta[name=theme-color]');
      if (m) m.setAttribute('content', dark ? '#000000' : '#ECF0EB');
    } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
  })();
</script>
</head>
<body>
<div id="root"><div id="boot" style="max-width:480px;margin:0 auto;padding:22px 16px">
  <div style="height:56px;border-radius:16px;background:var(--surface)"></div>
  <div style="height:150px;border-radius:20px;background:var(--surface-2);margin-top:14px"></div>
  <div style="height:64px;border-radius:16px;background:var(--surface-2);margin-top:10px"></div>
  <div style="height:64px;border-radius:16px;background:var(--surface-2);margin-top:8px"></div>
  <div style="text-align:center;color:var(--muted);font:400 13px/1.5 system-ui,sans-serif;margin-top:18px">Hosti загружается…</div>
</div></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="./app.js"></script>
<script>
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost','127.0.0.1'].includes(location.hostname))) {
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }
</script>
</body>
