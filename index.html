<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hosti — хостелы Узбекистана без комиссии</title>
<meta name="robots" content="index,follow">
<meta name="description" content="Реальная цена без комиссии, живая доступность коек, бесплатная отмена за 24 часа, регистрация e-mehmon за минуту.">
<meta name="theme-color" content="#14382C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./fonts/fonts.css">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#EFF2F0;color:#1C2823;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
  body{overscroll-behavior-y:none}
  input,button,textarea,select{font-family:inherit;font-size:16px}
  button{-webkit-appearance:none}
  ::-webkit-scrollbar{width:0;height:0}
  :root{--app-h:100dvh;--safe-top:0px;--safe-bottom:0px;--fs-pad-right:0px}
  #root{min-height:var(--app-h)}
  /* Только прозрачность: любой transform на контейнере экрана создаёт containing block
     и ломает position:fixed внутри — из-за этого панель с ценой и кнопкой брони
     переставала прилипать к низу карточки хостела. */
  .hs-fade{animation:hsFade .22s ease both}
  @keyframes hsFade{from{opacity:0}to{opacity:1}}
  .hs-rise{animation:hsRise .22s ease both}
  @keyframes hsRise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .hs-sheet{animation:hsSheet .26s cubic-bezier(.2,.8,.2,1) both}
  @keyframes hsSheet{from{transform:translateY(100%)}to{transform:none}}
  .hs-skel{background:linear-gradient(90deg,#E7ECE9 25%,#F2F5F3 37%,#E7ECE9 63%);background-size:400% 100%;animation:hsSk 1.2s infinite}
  @keyframes hsSk{from{background-position:100% 50%}to{background-position:0 50%}}
  .hs-scroll{overflow-x:auto;scrollbar-width:none}
  input:focus,textarea:focus{border-color:#0F6E5B!important;outline:2px solid #0F6E5B;outline-offset:1px}
  button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid #0F6E5B;outline-offset:2px;border-radius:8px}
  input::placeholder,textarea::placeholder{color:#6E7A74}
  .hs-tap{transition:background .12s}
  .hs-tap:active{background:#EDF3F0!important;border-radius:12px}
  .hs-tab:active{opacity:.6}
  button:disabled{cursor:default}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="root"><div id="boot" style="max-width:480px;margin:0 auto;padding:22px 16px">
  <div style="height:56px;border-radius:16px;background:#14382C"></div>
  <div style="height:150px;border-radius:20px;background:#E7ECE9;margin-top:14px"></div>
  <div style="height:64px;border-radius:16px;background:#E7ECE9;margin-top:10px"></div>
  <div style="height:64px;border-radius:16px;background:#E7ECE9;margin-top:8px"></div>
  <div style="text-align:center;color:#5C6862;font:400 13px/1.5 system-ui,sans-serif;margin-top:18px">Hosti загружается…</div>
</div></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="./app.js"></script>
<script>
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost','127.0.0.1'].includes(location.hostname))) {
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }
</script>
</body>
</html>
